[project]
name = "inspiratron"
version = "0.0.1"
description = "An agentic bot to provide a daily quote based on current affairs"
authors = [
    {name = "Walden Bodtker", email = "waldnzwrld@gmail.com"}
    ]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "huggingface-hub",
  "torch",
  "transformers"
]
project.optional-dependencies = []

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
